[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terminus-cli"
version = "0.1.0"
description = "AI-powered development companion for the command line"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.6.1",
    "pydantic>=2.12.3",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.2.1",
    "rich>=13.7.0",
]

[dependency-groups]
dev = ["ruff>=0.14.2"]

[project.scripts]
terminus = "terminus.__main__:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["terminus*", "ui*", "rich_ui*"]
